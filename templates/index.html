<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 650px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #e94560, #0f3460, #533483);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.5);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 1rem;
            resize: vertical;
            min-height: 120px;
            outline: none;
            transition: border 0.3s;
        }

        textarea::placeholder {
            color: rgba(255,255,255,0.3);
        }

        textarea:focus {
            border-color: #e94560;
        }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #e94560, #533483);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.1s;
            letter-spacing: 0.5px;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 24px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border-left: 4px solid #e94560;
            font-size: 0.95rem;
            line-height: 1.6;
            color: rgba(255,255,255,0.85);
            display: none;
        }

        #result.visible {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .dominant {
            font-size: 1.1rem;
            font-weight: bold;
            color: #e94560;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Emotion Detector</h1>
        <p class="subtitle">Powered by Watson NLP</p>

        <textarea id="textInput" placeholder="Enter a statement to analyse emotions..."></textarea>
        <button onclick="analyseEmotion()">Analyse Emotion</button>

        <div id="result"></div>
    </div>

    <script>
        async function analyseEmotion() {
            const text = document.getElementById('textInput').value.trim();
            const resultDiv = document.getElementById('result');

            if (!text) {
                resultDiv.innerHTML = '⚠️ Please enter some text to analyse.';
                resultDiv.className = 'visible';
                return;
            }

            resultDiv.innerHTML = '⏳ Analysing...';
            resultDiv.className = 'visible';

            try {
                const response = await fetch(`/emotionDetector?textToAnalyse=${encodeURIComponent(text)}`);
                const data = await response.text();
                resultDiv.innerHTML = data.includes('dominant emotion is')
                    ? data.replace(/The dominant emotion is (\w+)\./, 'The dominant emotion is <span class="dominant">$1</span>.')
                    : `⚠️ ${data}`;
                resultDiv.className = 'visible';
            } catch (error) {
                resultDiv.innerHTML = '❌ Error connecting to the server. Please try again.';
                resultDiv.className = 'visible';
            }
        }

        document.getElementById('textInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) analyseEmotion();
        });
    </script>
</body>
</html>
